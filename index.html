<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Communication App</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 15px;
      text-align: center;
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 1200px;
    }

    input, button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    input {
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #475569;
    }

    button.secondary:hover {
      background: #334155;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
      flex-grow: 1;
    }

    .video-card {
      position: relative;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header class="glass-panel">
    <h2>RTC Room</h2>
    <p id="peer-id-display">Seu ID: <span>Conectando...</span></p>
  </header>

  <div class="controls-bar glass-panel">
    <input type="text" id="remote-id-input" placeholder="ID do outro usuário" />
    <button onclick="connectToPeer()">Conectar Câmera</button>
    <button class="secondary" onclick="startScreenShare()">Compartilhar Tela</button>
  </div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay playsinline muted></video>
      <span class="video-label">Sua Câmera</span>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <span class="video-label">Câmera Remota</span>
    </div>
    <div class="video-card">
      <video id="remoteScreen" autoplay playsinline></video>
      <span class="video-label">Compartilhamento de Tela</span>
    </div>
  </div>

  <script>
    let peer = new Peer();
    let localStream = null;
    let screenStream = null;
    let activeCall = null;

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteScreen = document.getElementById('remoteScreen');
    const peerIdDisplay = document.getElementById('peer-id-display');

    // Inicializa a câmera local com suporte mobile
    async function initLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error('Erro ao acessar mídia:', err);
        alert('Não foi possível acessar a câmera/microfone.');
      }
    }

    peer.on('open', (id) => {
      peerIdDisplay.innerHTML = `Seu ID: <strong>${id}</strong>`;
    });

    // Atende chamadas recebidas (Câmera ou Tela)
    peer.on('call', (call) => {
      call.answer(localStream);
      call.on('stream', (stream) => {
        if (call.metadata && call.metadata.type === 'screen') {
          remoteScreen.srcObject = stream;
        } else {
          remoteVideo.srcObject = stream;
        }
      });
    });

    // Conecta à câmera de outro usuário
    function connectToPeer() {
      const remoteId = document.getElementById('remote-id-input').value.trim();
      if (!remoteId) return alert('Digite o ID do usuário remetente.');

      const call = peer.call(remoteId, localStream, { metadata: { type: 'camera' } });
      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
      });
    }

    // Compartilhamento de tela com trava de suporte para mobile
    async function startScreenShare() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        alert('O compartilhamento de tela não é suportado no navegador do seu celular. Utilize um computador para compartilhar a tela.');
        return;
      }

      const remoteId = document.getElementById('remote-id-input').value.trim();
      if (!remoteId) {
        alert('Digite o ID do usuário para quem deseja enviar a tela.');
        return;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: 'always' },
          audio: false
        });

        // Otimização de bitrate/contentHint para texto legível no PC
        const videoTrack = screenStream.getVideoTracks()[0];
        if ('contentHint' in videoTrack) {
          videoTrack.contentHint = 'text';
        }

        const screenCall = peer.call(remoteId, screenStream, { metadata: { type: 'screen' } });

        screenStream.getVideoTracks()[0].onended = () => {
          screenCall.close();
        };
      } catch (err) {
        console.error('Erro ao compartilhar tela:', err);
      }
    }

    window.onload = initLocalStream;
  </script>
</body>
</html>
