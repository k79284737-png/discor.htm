<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectRTC Pro - Suporte a Celular & WebRTC</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-radius: 16px;
    }

    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
    .logo i { color: var(--primary); }

    .user-profile { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--glass-border);
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .status-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .control-card { display: flex; flex-direction: column; gap: 8px; }
    .control-card label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .input-group { display: flex; gap: 8px; }

    input, select {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 0.88rem;
    }

    input:focus, select:focus { outline: none; border-color: var(--primary); }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--glass-border); }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }
    .btn-danger { background: var(--danger); color: white; }

    .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 15px; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      align-content: start;
      position: relative;
    }

    .video-card {
      position: relative;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--glass-border);
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .video-header {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid var(--glass-border);
      z-index: 2;
    }

    .reaction-overlay {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 999;
    }

    .floating-emoji {
      position: absolute;
      font-size: 3rem;
      animation: floatUp 2.5s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.6); }
      50% { opacity: 0.9; transform: translateY(-120px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-250px) scale(1.5); }
    }

    .chat-panel { display: flex; flex-direction: column; height: 100%; min-height: 480px; max-height: 580px; padding: 15px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; margin-bottom: 10px; }
    
    .chat-target-selector {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-target-selector label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }

    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; margin-bottom: 8px; }

    .msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; line-height: 1.35; word-break: break-word; }
    .msg.me { align-self: flex-end; background: var(--primary); color: #fff; }
    .msg.other { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: var(--text); }
    .msg.private { border: 1px dashed var(--warning); background: rgba(245, 158, 11, 0.15); }
    
    .msg-author { font-size: 0.7rem; opacity: 0.8; margin-bottom: 2px; font-weight: bold; display: flex; justify-content: space-between; gap: 8px; }
    .msg-tag { background: var(--warning); color: #000; padding: 1px 5px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }

    .typing-indicator { font-size: 0.75rem; color: var(--text-muted); font-style: italic; min-height: 18px; margin-bottom: 5px; }

    .reactions-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .btn-emoji {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-emoji:hover { transform: scale(1.3); }

    .media-actions { display: flex; justify-content: center; gap: 12px; padding: 12px; }
    .btn-icon { width: 44px; height: 44px; border-radius: 50%; padding: 0; }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .chat-panel { height: 360px; }
      .input-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="reaction-overlay" class="reaction-overlay"></div>

  <div class="container">
    <header class="glass-panel">
      <div class="logo">
        <i class="fa-solid fa-headset"></i>
        <span>ConnectRTC Pro</span>
      </div>
      <div class="user-profile">
        <div class="status-badge">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Desconectado</span>
        </div>
        <button id="btn-logout" class="btn btn-secondary" style="display: none; padding: 6px 12px;" onclick="fazerLogout()">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </header>

    <div class="controls-grid glass-panel">
      <!-- 1. Login -->
      <div class="control-card">
        <label><i class="fa-solid fa-id-card"></i> Meu Usuário</label>
        <div class="input-group">
          <input type="text" id="username-input" placeholder="Digite seu nome..." />
          <button id="btn-login" class="btn btn-primary" onclick="fazerLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
          </button>
        </div>
      </div>

      <!-- 2. Ligação Direta -->
      <div class="control-card">
        <label><i class="fa-solid fa-user"></i> Ligação (1x1)</label>
        <div class="input-group">
          <input type="text" id="direct-user-input" placeholder="Nome do usuário..." />
          <button class="btn btn-primary" onclick="ligarParaUsuario()">
            <i class="fa-solid fa-phone"></i> Ligar
          </button>
        </div>
      </div>

      <!-- 3. Sala em Grupo -->
      <div class="control-card">
        <label><i class="fa-solid fa-users"></i> Sala em Grupo</label>
        <div class="input-group">
          <input type="text" id="room-input" placeholder="Nome da sala..." />
          <button class="btn btn-primary" onclick="entrarNaSala()">
            <i class="fa-solid fa-door-open"></i> Entrar
          </button>
        </div>
      </div>

      <!-- 4. Compartilhar Tela -->
      <div class="control-card">
        <label><i class="fa-solid fa-desktop"></i> Transmissão</label>
        <button id="btn-screen" class="btn btn-secondary" onclick="toggleScreenShare()">
          <i class="fa-solid fa-display"></i> Compartilhar Tela
        </button>
      </div>
    </div>

    <div class="main-layout">
      <!-- Grid de Vídeos -->
      <div id="video-grid" class="video-grid">
        <div class="video-card">
          <div class="video-header"><i class="fa-solid fa-camera"></i> Minha Câmera</div>
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="video-card" id="screen-card" style="display: none;">
          <div class="video-header"><i class="fa-solid fa-desktop"></i> Minha Tela</div>
          <video id="localScreenVideo" autoplay playsinline muted></video>
        </div>
      </div>

      <!-- Chat e Interações -->
      <div class="chat-panel glass-panel">
        <div class="chat-header">
          <span><i class="fa-solid fa-comments"></i> Chat & Interações</span>
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="clearChatHistory()" title="Limpar Histórico">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>

        <!-- Seletor Grupo vs Privado -->
        <div class="chat-target-selector">
          <label><i class="fa-solid fa-paper-plane"></i> Enviar para:</label>
          <select id="chat-target-select">
            <option value="all">📢 Todos (Grupo)</option>
          </select>
        </div>

        <!-- Mensagens -->
        <div id="chat-messages" class="chat-messages"></div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <!-- Reações rápidas -->
        <div class="reactions-bar">
          <button class="btn-emoji" onclick="sendEmoji('👍')">👍</button>
          <button class="btn-emoji" onclick="sendEmoji('❤️')">❤️</button>
          <button class="btn-emoji" onclick="sendEmoji('😂')">😂</button>
          <button class="btn-emoji" onclick="sendEmoji('🔥')">🔥</button>
          <button class="btn-emoji" onclick="sendEmoji('✋')">✋</button>
        </div>

        <div class="input-group">
          <input type="text" id="chat-input" placeholder="Digite uma mensagem..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendChatMessage()" />
          <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <!-- Controles de Mídia Extra -->
    <div class="media-actions glass-panel">
      <button id="toggle-mic-btn" class="btn btn-secondary btn-icon" onclick="toggleAudio()" title="Mutar Microfone">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="toggle-cam-btn" class="btn btn-secondary btn-icon" onclick="toggleVideo()" title="Desligar Câmera">
        <i class="fa-solid fa-video"></i>
      </button>
      <button class="btn btn-secondary btn-icon" onclick="takeSnapshot()" title="Tirar Foto (Snapshot)">
        <i class="fa-solid fa-camera-retro"></i>
      </button>
    </div>
  </div>

  <script>
    let peer = null;
    let hostPeer = null;
    let myUsername = "";
    
    let localStream = null;
    let screenStream = null;
    let audioEnabled = true;
    let videoEnabled = true;
    let typingTimeout = null;

    const calls = {};      
    const dataConns = {};  
    const roomMembers = new Set();

    const localVideo = document.getElementById('localVideo');
    const localScreenVideo = document.getElementById('localScreenVideo');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const chatMessages = document.getElementById('chat-messages');
    const chatTargetSelect = document.getElementById('chat-target-select');
    const typingIndicator = document.getElementById('typing-indicator');

    function formatarId(texto) {
      return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
      loadChatHistory();
      checkScreenShareSupport();

      const savedUser = localStorage.getItem('connectrtc_unified_user');
      if (savedUser) {
        document.getElementById('username-input').value = savedUser;
        fazerLogin();
      }
    });

    // Detecta compatibilidade ao carregar
    function checkScreenShareSupport() {
      const btnScreen = document.getElementById('btn-screen');
      const isSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

      if (!isSupported) {
        btnScreen.disabled = true;
        btnScreen.classList.replace('btn-secondary', 'btn-danger');
        btnScreen.title = "Compartilhamento não suportado neste navegador";
        btnScreen.innerHTML = '<i class="fa-solid fa-ban"></i> Tela Indisponível';
      }
    }

    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.warn('Câmera/Microfone indisponíveis:', err);
      }
    }

    function fazerLogin() {
      const inputVal = document.getElementById('username-input').value;
      const formatted = formatarId(inputVal);

      if (!formatted) return alert('Digite um nome de usuário válido.');

      myUsername = formatted;
      localStorage.setItem('connectrtc_unified_user', myUsername);

      if (peer) peer.destroy();

      statusText.innerText = "Conectando ao servidor...";
      peer = new Peer(myUsername);

      peer.on('open', (id) => {
        statusText.innerHTML = `Logado como: <strong>${id}</strong>`;
        statusDot.classList.add('online');

        document.getElementById('username-input').disabled = true;
        document.getElementById('btn-login').style.display = 'none';
        document.getElementById('btn-logout').style.display = 'inline-flex';
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          alert('Usuário não encontrado ou offline.');
        } else if (err.type === 'unavailable-id') {
          alert('Nome em uso por outro dispositivo.');
          fazerLogout();
        } else {
          console.error('Erro PeerJS:', err);
        }
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        setupCall(call);

        if (screenStream) {
          setTimeout(async () => {
            const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
              await sender.replaceTrack(screenStream.getVideoTracks()[0]).catch(console.error);
            }
          }, 500);
        }
      });

      peer.on('connection', (conn) => {
        setupDataConn(conn);
      });
    }

    function fazerLogout() {
      if (peer) peer.destroy();
      if (hostPeer) hostPeer.destroy();

      localStorage.removeItem('connectrtc_unified_user');
      myUsername = "";

      statusText.innerText = "Desconectado";
      statusDot.classList.remove('online');

      document.getElementById('username-input').disabled = false;
      document.getElementById('username-input').value = "";
      document.getElementById('btn-login').style.display = 'inline-flex';
      document.getElementById('btn-logout').style.display = 'none';

      document.querySelectorAll('.remote-video-card').forEach(el => el.remove());
      updateChatTargets();
    }

    function ligarParaUsuario() {
      if (!peer || !myUsername) return alert('Faça login primeiro.');

      const targetUser = formatarId(document.getElementById('direct-user-input').value);
      if (!targetUser) return alert('Digite o nome do usuário.');
      if (targetUser === myUsername) return alert('Você não pode ligar para si mesmo.');

      const call = peer.call(targetUser, localStream);
      setupCall(call);

      const conn = peer.connect(targetUser);
      setupDataConn(conn);
    }

    function entrarNaSala() {
      if (!peer || !myUsername) return alert('Faça login primeiro.');

      const roomName = formatarId(document.getElementById('room-input').value);
      if (!roomName) return alert('Digite o nome da sala.');

      const hostId = roomName + '-group-host';

      const conn = peer.connect(hostId);
      const hostTimeout = setTimeout(() => {
        if (!conn.open) {
          iniciarHostDaSala(hostId);
        }
      }, 1200);

      conn.on('open', () => {
        clearTimeout(hostTimeout);
        conn.send({ type: 'JOIN_ROOM', peerId: myUsername });
      });

      conn.on('data', (data) => {
        if (data.type === 'ROOM_MEMBERS') {
          data.members.forEach(memberId => {
            if (memberId !== myUsername) {
              conectarAoParticipante(memberId);
            }
          });
        }
      });
    }

    function iniciarHostDaSala(hostId) {
      if (hostPeer) hostPeer.destroy();
      hostPeer = new Peer(hostId);

      roomMembers.clear();
      roomMembers.add(myUsername);

      hostPeer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'JOIN_ROOM') {
            const newPeer = data.peerId;
            conn.send({ type: 'ROOM_MEMBERS', members: Array.from(roomMembers) });

            Object.values(dataConns).forEach(c => {
              c.send({ type: 'NEW_MEMBER', peerId: newPeer });
            });

            roomMembers.add(newPeer);
          }
        });
      });
    }

    function conectarAoParticipante(remotePeerId) {
      if (calls[remotePeerId]) return;

      const call = peer.call(remotePeerId, localStream);
      setupCall(call);

      const conn = peer.connect(remotePeerId);
      setupDataConn(conn);
    }

    function setupCall(call) {
      calls[call.peer] = call;

      call.on('stream', (remoteStream) => {
        adicionarVideoRemoto(call.peer, remoteStream);
      });

      call.on('close', () => {
        removerVideoRemoto(call.peer);
        delete calls[call.peer];
        updateChatTargets();
      });

      call.on('error', (err) => console.error('Erro na chamada:', err));
    }

    function setupDataConn(conn) {
      dataConns[conn.peer] = conn;

      conn.on('open', () => {
        updateChatTargets();
      });

      conn.on('data', (data) => {
        if (data.type === 'CHAT') {
          appendMessage(data.sender, data.text, 'other', data.isPrivate);
        } else if (data.type === 'REACTION') {
          showFloatingReaction(data.emoji);
        } else if (data.type === 'TYPING') {
          showTypingIndicator(data.sender);
        } else if (data.type === 'NEW_MEMBER') {
          conectarAoParticipante(data.peerId);
        }
      });

      conn.on('close', () => {
        delete dataConns[conn.peer];
        updateChatTargets();
      });
    }

    function updateChatTargets() {
      const currentTarget = chatTargetSelect.value;
      chatTargetSelect.innerHTML = '<option value="all">📢 Todos (Grupo)</option>';

      Object.keys(dataConns).forEach(peerId => {
        const option = document.createElement('option');
        option.value = peerId;
        option.textContent = `🔒 Privado: ${peerId}`;
        chatTargetSelect.appendChild(option);
      });

      if (Array.from(chatTargetSelect.options).some(o => o.value === currentTarget)) {
        chatTargetSelect.value = currentTarget;
      }
    }

    // COMPARTILHAMENTO DE TELA ADAPTADO PARA MÓBILE E DESKTOP
    async function toggleScreenShare() {
      if (screenStream) {
        stopScreenShare();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        alert("Seu navegador ou protocolo atual não suporta captura de tela.\n\nPara funcionar no celular:\n1. Certifique-se de acessar via HTTPS.\n2. Abra o link fora do leitor do WhatsApp/Instagram (abra no Chrome/Safari).");
        return;
      }

      const activeCalls = Object.values(calls);
      if (activeCalls.length === 0) {
        alert("Você precisa estar em uma chamada ativa para compartilhar a tela.");
        return;
      }

      try {
        // Tenta capturar com fallback para navegadores móbiles
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        } catch (e) {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        }

        const screenTrack = screenStream.getVideoTracks()[0];

        localScreenVideo.srcObject = screenStream;
        document.getElementById('screen-card').style.display = 'block';
        document.getElementById('btn-screen').classList.replace('btn-secondary', 'btn-danger');

        for (const call of activeCalls) {
          if (call.peerConnection) {
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
              await videoSender.replaceTrack(screenTrack).catch(console.error);
            }
          }
        }

        screenTrack.onended = () => stopScreenShare();

      } catch (err) {
        console.error('Erro no compartilhamento de tela:', err);
        if (err.name === 'NotAllowedError') {
          alert('Permissão de captura de tela cancelada pelo usuário.');
        } else {
          alert('Falha ao compartilhar tela: ' + err.message);
        }
      }
    }

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
      }

      document.getElementById('screen-card').style.display = 'none';
      document.getElementById('btn-screen').classList.replace('btn-danger', 'btn-secondary');

      const videoTrack = localStream ? localStream.getVideoTracks()[0] : null;

      if (videoTrack) {
        Object.values(calls).forEach(async (call) => {
          if (call.peerConnection) {
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
              await videoSender.replaceTrack(videoTrack).catch(console.error);
            }
          }
        });
      }
    }

    function sendEmoji(emoji) {
      Object.values(dataConns).forEach(conn => {
        conn.send({ type: 'REACTION', emoji: emoji, sender: myUsername });
      });
      showFloatingReaction(emoji);
    }

    function showFloatingReaction(emoji) {
      const overlay = document.getElementById('reaction-overlay');
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.innerText = emoji;
      el.style.left = `${Math.random() * 80 - 40}px`;
      overlay.appendChild(el);

      setTimeout(() => el.remove(), 2500);
    }

    function handleTyping() {
      Object.values(dataConns).forEach(conn => {
        conn.send({ type: 'TYPING', sender: myUsername });
      });
    }

    function showTypingIndicator(sender) {
      typingIndicator.innerText = `${sender} está digitando...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typingIndicator.innerText = "";
      }, 2000);
    }

    function takeSnapshot() {
      if (!localVideo.srcObject) return alert('Nenhum vídeo local ativo para fotografar.');

      const canvas = document.createElement('canvas');
      canvas.width = localVideo.videoWidth || 640;
      canvas.height = localVideo.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `connectrtc-snapshot-${Date.now()}.png`;
      a.click();
    }

    function adicionarVideoRemoto(peerId, stream) {
      let card = document.getElementById(`video-card-${peerId}`);
      if (!card) {
        card = document.createElement('div');
        card.className = 'video-card remote-video-card';
        card.id = `video-card-${peerId}`;
        card.innerHTML = `
          <div class="video-header"><i class="fa-solid fa-user"></i> ${peerId}</div>
          <video id="video-${peerId}" autoplay playsinline></video>
        `;
        document.getElementById('video-grid').appendChild(card);
      }
      const vid = document.getElementById(`video-${peerId}`);
      vid.srcObject = stream;
    }

    function removerVideoRemoto(peerId) {
      const card = document.getElementById(`video-card-${peerId}`);
      if (card) card.remove();
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const target = chatTargetSelect.value;
      const isPrivate = target !== 'all';

      if (isPrivate) {
        const conn = dataConns[target];
        if (conn) {
          conn.send({ type: 'CHAT', sender: myUsername, text: text, isPrivate: true });
          appendMessage(`Para [${target}]`, text, 'me', true);
        } else {
          alert('Usuário não está mais conectado.');
        }
      } else {
        const activeConns = Object.values(dataConns);
        if (activeConns.length === 0) {
          return alert('Conecte-se a alguém ou entre em uma sala primeiro.');
        }

        activeConns.forEach(conn => {
          conn.send({ type: 'CHAT', sender: myUsername, text: text, isPrivate: false });
        });
        appendMessage('Você', text, 'me', false);
      }

      input.value = '';
    }

    function appendMessage(sender, text, type, isPrivate = false) {
      appendMessageToDOM(sender, text, type, isPrivate);
      const history = JSON.parse(localStorage.getItem('connectrtc_unified_chat') || '[]');
      history.push({ sender, text, type, isPrivate });
      localStorage.setItem('connectrtc_unified_chat', JSON.stringify(history));
    }

    function appendMessageToDOM(sender, text, type, isPrivate = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type} ${isPrivate ? 'private' : ''}`;
      
      const tagHtml = isPrivate ? `<span class="msg-tag">Privado</span>` : '';
      msgDiv.innerHTML = `<div class="msg-author"><span>${sender}</span> ${tagHtml}</div>${text}`;
      
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function loadChatHistory() {
      const saved = localStorage.getItem('connectrtc_unified_chat');
      if (saved) {
        const history = JSON.parse(saved);
        chatMessages.innerHTML = '';
        history.forEach(msg => appendMessageToDOM(msg.sender, msg.text, msg.type, msg.isPrivate));
      }
    }

    function clearChatHistory() {
      if (confirm('Deseja apagar o histórico de mensagens?')) {
        localStorage.removeItem('connectrtc_unified_chat');
        chatMessages.innerHTML = '';
      }
    }

    function toggleAudio() {
      if (localStream && localStream.getAudioTracks().length > 0) {
        audioEnabled = !audioEnabled;
        localStream.getAudioTracks()[0].enabled = audioEnabled;
        const btn = document.getElementById('toggle-mic-btn');
        btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
        btn.classList.toggle('btn-danger', !audioEnabled);
      }
    }

    function toggleVideo() {
      if (localStream && localStream.getVideoTracks().length > 0) {
        videoEnabled = !videoEnabled;
        localStream.getVideoTracks()[0].enabled = videoEnabled;
        const btn = document.getElementById('toggle-cam-btn');
        btn.innerHTML = videoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
        btn.classList.toggle('btn-danger', !videoEnabled);
      }
    }
  </script>
</body>
</html>
