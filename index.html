<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectRTC - Video, Screen & Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-radius: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .logo i { color: var(--primary); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.85rem;
      border: 1px solid var(--glass-border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .control-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-card label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--glass-border);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 15px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .video-card {
      position: relative;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--glass-border);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-header {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid var(--glass-border);
    }

    /* Chat Section */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 400px;
      max-height: 520px;
      padding: 15px;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
      margin-bottom: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }

    .msg.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .msg-author {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    .media-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
    }

    .btn-danger { background: var(--danger); color: white; }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .chat-panel { height: 320px; }
      .input-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="glass-panel">
      <div class="logo">
        <i class="fa-solid fa-video"></i>
        <span>ConnectRTC</span>
      </div>
      <div class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Desconectado</span>
      </div>
    </header>

    <div class="controls-grid glass-panel">
      <!-- Nome / ID Fixo Salvo -->
      <div class="control-card">
        <label><i class="fa-solid fa-user"></i> Meu Nome (Salvo)</label>
        <div class="input-group">
          <input type="text" id="my-id-input" placeholder="Digite seu nome..." />
          <button id="btn-entrar" class="btn btn-primary" onclick="definirMeuId()">
            <i class="fa-solid fa-check"></i> Salvar & Entrar
          </button>
          <button id="btn-trocar" class="btn btn-secondary" onclick="trocarNome()" style="display: none;">
            <i class="fa-solid fa-pen"></i> Trocar Nome
          </button>
        </div>
      </div>

      <!-- Conexão com o parceiro -->
      <div class="control-card">
        <label><i class="fa-solid fa-phone"></i> Ligar para Alguém</label>
        <div class="input-group">
          <input type="text" id="remote-id-input" placeholder="Nome do amigo..." />
          <button class="btn btn-primary" onclick="connectToPeer()">
            <i class="fa-solid fa-paper-plane"></i> Conectar
          </button>
        </div>
      </div>

      <!-- Compartilhar Tela -->
      <div class="control-card">
        <label><i class="fa-solid fa-desktop"></i> Transmissão de Tela</label>
        <button class="btn btn-secondary" onclick="startScreenShare()">
          <i class="fa-solid fa-display"></i> Transmitir Tela
        </button>
      </div>
    </div>

    <div class="main-layout">
      <!-- Vídeos -->
      <div class="video-grid">
        <div class="video-card">
          <div class="video-header"><i class="fa-solid fa-camera"></i> Sua Câmera</div>
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="video-card">
          <div class="video-header"><i class="fa-solid fa-user-group"></i> Câmera Remota</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="video-card">
          <div class="video-header"><i class="fa-solid fa-desktop"></i> Tela Remota</div>
          <video id="remoteScreen" autoplay playsinline></video>
        </div>
      </div>

      <!-- Chat -->
      <div class="chat-panel glass-panel">
        <div class="chat-header">
          <span><i class="fa-solid fa-comments"></i> Chat da Sala</span>
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="clearChatHistory()" title="Limpar Histórico">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="input-group">
          <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter') sendChatMessage()" />
          <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <!-- Mídia -->
    <div class="media-actions glass-panel">
      <button id="toggle-mic-btn" class="btn btn-secondary btn-icon" onclick="toggleAudio()" title="Mutar Microfone">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="toggle-cam-btn" class="btn btn-secondary btn-icon" onclick="toggleVideo()" title="Desligar Câmera">
        <i class="fa-solid fa-video"></i>
      </button>
    </div>
  </div>

  <script>
    let peer = null;
    let dataConn = null;
    let localStream = null;
    let screenStream = null;
    let audioEnabled = true;
    let videoEnabled = true;
    let myRegisteredId = "";
    let chatHistory = JSON.parse(localStorage.getItem('rtc_chat_history') || '[]');

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteScreen = document.getElementById('remoteScreen');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const chatMessages = document.getElementById('chat-messages');

    async function initLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error('Erro ao acessar câmera/microfone:', err);
      }
      
      loadChatHistory();

      // Carrega o NOME SALVO automaticamente do navegador
      const savedName = localStorage.getItem('rtc_saved_username');
      if (savedName) {
        document.getElementById('my-id-input').value = savedName;
        definirMeuId(); // Conecta direto com o nome que já estava salvo!
      }
    }

    function definirMeuId() {
      const input = document.getElementById('my-id-input');
      const meuId = input.value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!meuId) return alert('Digite um nome ou ID válido.');

      if (peer) peer.destroy();
      peer = new Peer(meuId);

      peer.on('open', (id) => {
        myRegisteredId = id;
        
        // SALVA O NOME NO NAVEGADOR
        localStorage.setItem('rtc_saved_username', id);

        statusText.innerHTML = `Ativo como: <strong>${id}</strong>`;
        statusDot.classList.add('online');
        
        input.disabled = true;
        document.getElementById('btn-entrar').style.display = 'none';
        document.getElementById('btn-trocar').style.display = 'inline-flex';
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert('Este ID já está ativo em outro aparelho.');
        } else {
          console.error(err);
        }
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (stream) => {
          if (call.metadata && call.metadata.type === 'screen') {
            remoteScreen.srcObject = stream;
          } else {
            remoteVideo.srcObject = stream;
          }
        });
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        setupChatListeners();
      });
    }

    function trocarNome() {
      if (peer) {
        peer.destroy();
        peer = null;
      }
      myRegisteredId = "";
      
      // APAGA O NOME SALVO DO NAVEGADOR
      localStorage.removeItem('rtc_saved_username');

      statusText.innerHTML = "Desconectado";
      statusDot.classList.remove('online');

      const input = document.getElementById('my-id-input');
      input.disabled = false;
      input.value = "";
      document.getElementById('btn-entrar').style.display = 'inline-flex';
      document.getElementById('btn-trocar').style.display = 'none';
    }

    function connectToPeer() {
      if (!peer) return alert('Defina seu nome primeiro.');
      
      const remoteId = document.getElementById('remote-id-input').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!remoteId) return alert('Digite o nome de quem quer ligar.');

      const call = peer.call(remoteId, localStream, { metadata: { type: 'camera' } });
      call.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
      });

      dataConn = peer.connect(remoteId);
      setupChatListeners();
    }

    function setupChatListeners() {
      if (!dataConn) return;
      dataConn.on('data', (data) => {
        appendMessage(data.sender, data.text, 'other');
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!dataConn || !dataConn.open) {
        alert('Conecte-se a alguém primeiro para mandar mensagem.');
        return;
      }

      const senderName = myRegisteredId || 'Você';
      dataConn.send({ sender: senderName, text: text });
      appendMessage('Você', text, 'me');
      input.value = '';
    }

    function appendMessage(sender, text, type) {
      appendMessageToDOM(sender, text, type);
      chatHistory.push({ sender, text, type });
      localStorage.setItem('rtc_chat_history', JSON.stringify(chatHistory));
    }

    function appendMessageToDOM(sender, text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type}`;
      msgDiv.innerHTML = `<div class="msg-author">${sender}</div>${text}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function loadChatHistory() {
      chatMessages.innerHTML = '';
      chatHistory.forEach(msg => {
        appendMessageToDOM(msg.sender, msg.text, msg.type);
      });
    }

    function clearChatHistory() {
      if (confirm('Deseja apagar as mensagens guardadas?')) {
        chatHistory = [];
        localStorage.removeItem('rtc_chat_history');
        chatMessages.innerHTML = '';
      }
    }

    async function startScreenShare() {
      if (!peer) return alert('Defina seu nome primeiro.');

      const remoteId = document.getElementById('remote-id-input').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!remoteId) return alert('Digite o nome do parceiro para enviar a tela.');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        alert('O seu navegador não suporta compartilhamento de tela.');
        return;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        const screenCall = peer.call(remoteId, screenStream, { metadata: { type: 'screen' } });
        
        screenStream.getVideoTracks()[0].onended = () => {
          screenCall.close();
        };
      } catch (err) {
        console.error(err);
      }
    }

    function toggleAudio() {
      if (localStream) {
        audioEnabled = !audioEnabled;
        localStream.getAudioTracks()[0].enabled = audioEnabled;
        const btn = document.getElementById('toggle-mic-btn');
        btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
        btn.classList.toggle('btn-danger', !audioEnabled);
      }
    }

    function toggleVideo() {
      if (localStream) {
        videoEnabled = !videoEnabled;
        localStream.getVideoTracks()[0].enabled = videoEnabled;
        const btn = document.getElementById('toggle-cam-btn');
        btn.innerHTML = videoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
        btn.classList.toggle('btn-danger', !videoEnabled);
      }
    }

    window.onload = initLocalStream;
  </script>
</body>
</html>
